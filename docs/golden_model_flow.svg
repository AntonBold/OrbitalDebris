<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="58" font-size="34" font-weight="bold" fill="#222">Golden model: every test frame checked against an independent answer key</text>

  <!-- generator -->
  <rect x="40" y="330" width="270" height="170" rx="14" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="175" y="375" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Test frames</text>
  <text x="175" y="412" font-size="19" text-anchor="middle" fill="#333">directed edge cases</text>
  <text x="175" y="440" font-size="19" text-anchor="middle" fill="#333">random (seeded)</text>
  <text x="175" y="468" font-size="19" text-anchor="middle" fill="#333">full 1920×1080</text>

  <!-- golden lane -->
  <rect x="400" y="110" width="360" height="150" rx="14" fill="#fff4d6" stroke="#c08a00" stroke-width="2.5"/>
  <text x="580" y="155" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Golden model (Python)</text>
  <text x="580" y="192" font-size="19" text-anchor="middle" fill="#333">plain flood fill, 4-connectivity</text>
  <text x="580" y="220" font-size="19" text-anchor="middle" fill="#333">simple, obviously correct</text>

  <rect x="840" y="110" width="300" height="150" rx="14" fill="#fff4d6" stroke="#c08a00" stroke-width="2.5"/>
  <text x="990" y="155" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Expected objects</text>
  <text x="990" y="192" font-size="19" text-anchor="middle" fill="#333">area, X_sum, Y_sum</text>
  <text x="990" y="220" font-size="19" text-anchor="middle" fill="#333">per object, per frame</text>

  <!-- hardware lane -->
  <rect x="400" y="530" width="360" height="150" rx="14" fill="#e3eefc" stroke="#2f6db5" stroke-width="2.5"/>
  <text x="580" y="575" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">RTL: cca_top (simulated)</text>
  <text x="580" y="612" font-size="19" text-anchor="middle" fill="#333">streaming single-pass CCL</text>
  <text x="580" y="640" font-size="19" text-anchor="middle" fill="#333">(Spagnolo et al. 2019)</text>

  <rect x="840" y="530" width="300" height="150" rx="14" fill="#e3eefc" stroke="#2f6db5" stroke-width="2.5"/>
  <text x="990" y="575" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">BRAM contents</text>
  <text x="990" y="612" font-size="19" text-anchor="middle" fill="#333">what the ARM would read</text>
  <text x="990" y="640" font-size="19" text-anchor="middle" fill="#333">header + 2 words / object</text>

  <!-- scoreboard -->
  <rect x="1220" y="330" width="330" height="170" rx="14" fill="#efe8f7" stroke="#6a3fa0" stroke-width="2.5"/>
  <text x="1385" y="378" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Scoreboard</text>
  <text x="1385" y="415" font-size="19" text-anchor="middle" fill="#333">compares every object</text>
  <text x="1385" y="443" font-size="19" text-anchor="middle" fill="#333">+ protocol checkers</text>
  <text x="1385" y="471" font-size="19" text-anchor="middle" fill="#333">(timing, interrupt, BRAM order)</text>

  <!-- board -->
  <rect x="1220" y="90" width="330" height="175" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="1385" y="135" font-size="25" font-weight="bold" text-anchor="middle" fill="#222">Real board</text>
  <text x="1385" y="172" font-size="19" text-anchor="middle" fill="#333">same numbers, bit for bit</text>
  <text x="1385" y="200" font-size="19" text-anchor="middle" fill="#333">92 frames, 0 errors</text>
  <text x="1385" y="240" font-size="17" font-style="italic" text-anchor="middle" fill="#2e8b57">predicted before the first board run</text>

  <!-- outcomes -->
  <rect x="1220" y="560" width="330" height="66" rx="12" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="1385" y="602" font-size="21" text-anchor="middle" fill="#222"><tspan font-weight="bold">PASS</tspan>: hardware matches</text>

  <rect x="1220" y="645" width="330" height="96" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="1385" y="682" font-size="21" text-anchor="middle" fill="#222"><tspan font-weight="bold">FAIL</tspan> → auto-minimized</text>
  <text x="1385" y="714" font-size="18" text-anchor="middle" fill="#333">smallest failing frame = bug report</text>

  <rect x="1220" y="760" width="330" height="96" rx="12" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="1385" y="797" font-size="21" text-anchor="middle" fill="#222"><tspan font-weight="bold">XFAIL</tspan>: known limit, auto-tagged</text>
  <text x="1385" y="829" font-size="19" text-anchor="middle" fill="#333">(area &gt; 511, &gt; 256 objects, …)</text>

  <!-- arrows -->
  <g stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M310,415 H355 V185 H396"/>
    <path d="M355,415 V605 H396"/>
    <path d="M760,185 H836"/>
    <path d="M760,605 H836"/>
    <path d="M1140,225 H1180 V390 H1216"/>
    <path d="M1140,605 H1180 V440 H1216"/>
    <path d="M1385,500 V556"/>
  </g>
  <path d="M1140,150 H1216" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="8,6" fill="none" marker-end="url(#arrow)"/>

  <!-- takeaways -->
  <text x="40" y="770" font-size="22" font-weight="bold" fill="#222">Two different algorithms rarely share a bug,</text>
  <text x="40" y="800" font-size="22" font-weight="bold" fill="#222">so a mismatch means a real bug.</text>
  <text x="40" y="840" font-size="20" fill="#333">All 8 RTL defects were caught this way, each as a reproducible frame.</text>
</svg>
